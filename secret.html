
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mwehehehe ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #fbc2eb, #fad0c4, #f6d5e5, #d8c7ff);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.card {
    width: min(92%, 430px);
    padding: 35px 28px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(18px);
    box-shadow: 0 25px 70px rgba(120,60,90,0.2);
    border: 1px solid rgba(255,255,255,0.8);
    position: relative;
    animation: cardIn 1s ease;
    z-index: 2;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.profile {
    width: 125px;
    height: 125px;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
    border: 5px solid white;
    box-shadow: 0 8px 25px rgba(255,105,160,.35);
    margin-bottom: 18px;
    animation: heartbeat 2s infinite;
}

@keyframes heartbeat {
    50% { transform: scale(1.06); }
}

h2 {
    font-family: 'Playfair Display', serif;
    color: #78465c;
    font-size: 29px;
    line-height: 1.4;
    margin-bottom: 12px;
}

.message {
    font-size: 14px;
    color: #936e7d;
    line-height: 1.8;
    margin-bottom: 25px;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 13px;
}

button {
    border: none;
    padding: 13px 22px;
    border-radius: 35px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: .25s;
}

#yes {
    color: white;
    background: linear-gradient(135deg, #ff6fa5, #ed8ab5);
    box-shadow: 0 8px 20px rgba(255,105,160,.35);
}

#yes:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 25px rgba(255,105,160,.5);
}

#no {
    color: #805d6d;
    background: #fff8fa;
    border: 1px solid #efc8d8;
}

#no:hover {
    background: #fce9f0;
    transform: translateY(-3px);
}

.hint {
    margin-top: 25px;
    color: #aa8494;
    font-size: 12px;
    font-style: italic;
}

.heart {
    position: absolute;
    bottom: -30px;
    pointer-events: none;
    animation: floatUp linear forwards;
    z-index: 1;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(40deg);
        opacity: 0;
    }
}

.hidden {
    display: none;
}

.success h2 {
    color: #b45d83;
}

.sparkle {
    position: absolute;
    pointer-events: none;
    animation: sparkle 1.5s ease-out forwards;
}

@keyframes sparkle {
    to {
        transform: translateY(-100px) scale(1.5);
        opacity: 0;
    }
}

@media(max-width:480px) {
    h2 { font-size: 25px; }
    .card { padding: 35px 22px; }
}
</style>
</head>

<body>

<div class="card" id="mainCard">

    <img src="jasmin.jpg" class="profile" alt="Jasmin">

    <h2>Hi, Princess Jasmin! ♡</h2>

    <p class="message">
        Can i ask you something hehehe
        <br><br>
        Would you like to come to church with me this sunday?
        <br><br>
        im being for real...
    </p>

    <div class="buttons">
        <button id="yes">sige cute ka naman e! 😍</button>
        <button id="no">No Way</button>
    </div>

    <p class="hint">Inaya kana ng pogi. ✨</p>

</div>

<div class="card hidden" id="successCard">

    <div class="emoji">🥹💗</div>

    <h2>YAYYYY!</h2>

    <p class="message">
        yeheeeyyy, Thanks Jasmin baho!
        <br><br>
        for real to ha, November 29, Sunday
        <br><br>
        At dahil diyan, maligo. ♡
    </p>

    <div class="emoji">⛪✨</div>

    <p class="hint">See yaa!!!</p>

</div>

<script>

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const mainCard = document.getElementById("mainCard");
const successCard = document.getElementById("successCard");

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audio = AudioContext ? new AudioContext() : null;

function playSound(freq, duration = 0.2) {
    if (!audio) return;

    if (audio.state === "suspended") audio.resume();

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = freq;

    gain.gain.setValueAtTime(0.08, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(audio.currentTime + duration);
}


const noMessages = [
    "No Way",
    "Cmon bro ☹️",
    "Sige naaaaa",
    "Dali na Princess",
    "PLZZZZZ 🙏🙏🙏"
];

let noIndex = 0;

noBtn.addEventListener("mouseenter", () => {
    playSound(650, 0.15);
});

noBtn.addEventListener("click", () => {

    playSound(400, 0.2);

    noIndex++;

    if (noIndex >= noMessages.length) {
        noIndex = 0;
    }

    noBtn.textContent = noMessages[noIndex];

});


yesBtn.addEventListener("click", () => {

    playSound(880, 0.5);

    mainCard.classList.add("hidden");
    successCard.classList.remove("hidden");

    createConfetti();

});


function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.textContent = Math.random() > 0.5 ? "💗" : "♡";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    heart.style.animationDuration = Math.random() * 3 + 4 + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 450);


function createConfetti() {

    const symbols = ["💗", "✨", "💕", "🌸", "♡"];

    for (let i = 0; i < 100; i++) {

        const particle = document.createElement("div");

        particle.className = "sparkle";
        particle.textContent = symbols[
            Math.floor(Math.random() * symbols.length)
        ];

        particle.style.left = Math.random() * 100 + "vw";
        particle.style.top = Math.random() * 100 + "vh";
        particle.style.fontSize = Math.random() * 20 + 12 + "px";
        particle.style.animationDuration = Math.random() * 2 + 1 + "s";

        document.body.appendChild(particle);

        setTimeout(() => particle.remove(), 3000);
    }
}

</script>

</body>
</html>
